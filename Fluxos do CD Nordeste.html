<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxos do CD Nordeste</title>
<!--
  PÁGINA DE FLUXOS — MODELO OPERACIONAL FUTURO (CD ~30 mil m², RM de Fortaleza, porto do Pecém)
  Projeto CD Nordeste · VW Pós-Vendas × KPMG
  Versão da página: v1.0 (16/11/2026) | Fontes: RFI V20261113, aba Perfil_Referencia; MD base v0.28 (4.10, 4.15, 4.17, 4.19)
  Página separada do painel (não altera VW_CD_NE_Painel_v1.1.html). Regras: VW_CD_NE_MD_Painel_Interativo.md, seção 6.F.
  Blocos: STYLE | HEADER | HTML | FLOW_DATA (volumes e status, com fonte por número) | GEO | I18N | APP (mapa, filtros, passo a passo)
  Custos em R$: fora desta versão (fretes em cotação na RFI; respostas em 23/11). Campo `cost` pronto em cada fluxo/modal.
  Regra 7 do MD base: sem nomes de transportadoras/armadores; sem comparação CE × PE (só o CD no Ceará, cenário da RFI).
-->
<!-- ===== STYLE START ===== -->
<style>
:root{
  /* Estilo Nordic Yellow — KPMG (v1.1; ref.: _apoio_painel/nordic-yellow-KPMG.md + brandbook KPMG 2022)
     Azul KPMG domina navegação e ações; Cobalt para ênfase; branco como canvas; neutros de UI. */
  --kpmg-blue:#00338D; --primary:#00338D; --primary-hover:#0C233C; --cobalt:#1E49E2; --dark:#0C233C;
  --pacific:#00B8F5; --purple:#7213EA; --light-blue:#76D2FF; --green:#00C0AE;
  --pink:#FD349C;            /* só gráfico de alerta (DGR, aéreo) — regra 5 do MD do painel; nunca texto */
  --ink:#333333; --muted:#666666; --line:#DFDFDF; --bg:#F5F5F5; --card:#FFFFFF; --soft:#F5F5F5;
  --ok:#098E7E;              /* Success — Dark Green */
  --warn:#AB0D82;            /* Error/alerta textual — Dark Pink, sempre com texto explícito */
  --caution:#666666;         /* Warning — Gray 2, sempre com ícone + rótulo */
  /* Tipografia: KPMG Bold (display/H1–H3) não é webfont licenciada → Arial Bold (D-P3); corpo Arial */
  --f-display:"KPMG Bold","KPMG", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-body:Arial, "Helvetica Neue", Helvetica, sans-serif;
  /* Raio e elevação (flat; separação por cor e borda) */
  --r:4px; --r-panel:8px; --r-modal:12px;
  --shadow:0 1px 3px rgba(12,35,60,.06);      /* nível 1 — cartões em repouso */
  --shadow-2:0 4px 12px rgba(12,35,60,.08);   /* nível 2 — hover, dropdowns */
  --shadow-3:0 8px 24px rgba(12,35,60,.12);   /* nível 3 — modais */
  --wrap:1400px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;letter-spacing:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.3;letter-spacing:0;text-wrap:balance}
/* Header — barra de marca 60px azul KPMG + navegação secundária 44px branca */
.hdr{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hdr-bar{background:var(--primary);color:#fff}
.hdr-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:60px;padding:0 20px;max-width:var(--wrap);margin:0 auto}
.logo-vw{height:40px;width:40px;display:block;background:#fff;border-radius:9999px;padding:2px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-title{text-align:center}
.hdr-title h1{font-size:18px;color:#fff}
.hdr-title p{margin:0;color:#fff;opacity:.85;font-size:12px;line-height:1.3}
.hdr-right{display:flex;align-items:center;justify-content:flex-end;gap:20px}
.logo-kpmg{height:32px;width:auto;display:block}
.lang{display:flex;gap:4px;padding:2px;border:1px solid rgba(255,255,255,.55);border-radius:var(--r)}
.lang button{display:flex;align-items:center;gap:6px;height:28px;border:0;background:transparent;padding:0 10px 0 6px;border-radius:2px;cursor:pointer;font-size:12px;font-weight:700;color:#fff}
.lang button:hover{background:rgba(255,255,255,.14)}
.lang button[aria-pressed="true"]{background:#fff;color:var(--primary)}
.lang svg{width:22px;height:15px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.tabs{display:flex;gap:8px;height:44px;padding:0 20px;max-width:var(--wrap);margin:0 auto;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:8px;padding:0 12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;border-bottom:3px solid transparent;border-top:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--primary)}
.tabs a .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:9999px;background:var(--soft);color:var(--primary);font-size:11px}
.tabs a[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary)}
.tabs a[aria-current="page"] .n{background:var(--primary);color:#fff}
/* Page frame */
main{max-width:var(--wrap);margin:0 auto;padding:24px 20px 8px}
.page{display:none}
.page.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h2{font-size:24px;color:var(--ink)}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:820px}
.grid-2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card h3{font-size:16px;color:var(--primary);margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
/* Chips de status (badges 2px): texto explícito sempre; cor não é o único sinal */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:2px;font-size:11px;font-weight:700;background:#fff;color:var(--primary);border:1px solid var(--line);white-space:nowrap;line-height:1}
.chip.conf{background:#E6F3F1;border-color:#E6F3F1;color:var(--ok)}
.chip.pend{background:var(--soft);border-color:var(--line);color:var(--caution)}
.chip.pend::before{content:"!";display:inline-grid;place-items:center;width:12px;height:12px;border-radius:9999px;background:var(--caution);color:#fff;font-size:9px;font-weight:700}
.chip.kpmg{background:#EDF1FD;border-color:#EDF1FD;color:var(--cobalt)}
.chip.dado{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.chip.ext{background:#F3ECFD;border-color:#F3ECFD;color:var(--purple)}
/* Chips/segmentos de seleção: 28px, raio 4px; ativo = azul KPMG */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:28px;border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:0 12px;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px}
.seg button:hover{border-color:var(--primary)}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:#fff}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:20px}
.kpi{padding:16px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700}
.kpi .val{font-size:24px;font-weight:700;color:var(--primary);margin-top:4px;font-family:var(--f-body);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .val small{font-size:12px;color:var(--muted);font-weight:400}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .split{display:flex;gap:16px}
.kpi .split div{flex:1}
.foot{max-width:var(--wrap);margin:8px auto 24px;padding:0 20px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.hdr-row{grid-template-columns:auto 1fr auto;padding:0 12px;gap:8px}.hdr-title h1{font-size:16px}.hdr-title p{display:none}.logo-vw{height:32px;width:32px}.logo-kpmg{height:22px}.lang button span{display:none}.lang button{padding:0 6px}main{padding:16px 12px}.tabs{padding:0 12px}.kpis{grid-template-columns:1fr;gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Página Fluxos (modelo futuro) ---- */
:root{ --in:#00B8F5; --out:#00C0AE; --impl:#76D2FF; }
.stepbar{display:flex;align-items:center;gap:8px;height:52px;padding:0 20px;max-width:var(--wrap);margin:0 auto;overflow-x:auto}
.stepbar .steps{display:flex;gap:6px;flex:1;min-width:0}
.stepbar button.st{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap}
.stepbar button.st .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:9999px;background:var(--soft);color:var(--primary);font-size:11px}
.stepbar button.st[aria-current="step"]{border-color:var(--primary);background:var(--primary);color:#fff}
.stepbar button.st[aria-current="step"] .n{background:#fff;color:var(--primary)}
.stepbar .nav{display:flex;gap:6px}
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:2px solid var(--primary);background:#fff;color:var(--primary);font-weight:700;cursor:pointer;font-size:13px}
.btn.primary{background:var(--primary);color:#fff}
.btn:disabled{border-color:var(--line);color:var(--muted);background:var(--soft);cursor:default}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.step-cap{margin:0 0 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.step-cap h2{font-size:22px;color:var(--ink)}
.step-cap p{margin:0;color:var(--muted);max-width:760px}
.ctl h3{font-size:13px;color:var(--primary);margin:0 0 8px;text-transform:uppercase;letter-spacing:.3px}
.frow{display:grid;grid-template-columns:18px 22px 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.frow .sw{width:22px;height:4px;border-radius:2px}
.frow .sw.sea{background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 10px)!important}
.frow label{font-size:13px;font-weight:700;cursor:pointer}
.frow label small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.frow.off{opacity:.45}
.frow .modes{grid-column:3/4;margin-top:4px}
.frow .modes .seg button{height:24px;font-size:11px;padding:0 8px}
.rt-box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--ink)}
.rt-box b{color:var(--primary)}
.rt-box.warn{border-color:#E9C6DD;background:#FBF1F7}
.map-wrap{background:var(--dark);border-radius:var(--r-panel);overflow:hidden;position:relative;box-shadow:var(--shadow)}
.map-wrap svg{display:block;width:100%;height:auto}
.map-legend{position:absolute;left:12px;bottom:12px;background:rgba(12,35,60,.9);border:1px solid rgba(118,210,255,.25);border-radius:8px;padding:8px 10px;color:#fff;font-size:11px;display:grid;gap:4px;max-width:250px}
.map-legend div{display:flex;align-items:center;gap:8px}
.map-legend svg{width:34px;height:10px;flex:none}
.map-legend .ln{color:#BFD3EA;font-size:10px;border-top:1px solid rgba(255,255,255,.15);padding-top:4px;margin-top:2px}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:#BFD3EA;font-size:15px;pointer-events:none}
.map-empty[hidden]{display:none}
.ficha-float{position:absolute;left:12px;top:12px;width:310px;max-height:calc(100% - 24px);overflow:auto;box-shadow:var(--shadow-3)}
.state{fill:#173A63;stroke:#2F5C8F;stroke-width:.6}
.state.ne{fill:#215089;stroke:#4A7AB0}
.region{fill:transparent;stroke:#76D2FF;stroke-opacity:.18;stroke-width:1.2}
.ln-road{fill:none;stroke-linecap:round;stroke-width:2.4}
.ln-sea{fill:none;stroke-linecap:round;stroke-width:2;stroke-dasharray:8 6;animation:march 1.4s linear infinite}
.ln-impl{fill:none;stroke-linecap:round;stroke-width:2.2;stroke-dasharray:2 5;animation:march 1.4s linear infinite}
.ln-faded{fill:none;stroke-linecap:round;stroke-width:1.4;opacity:.35}
@keyframes march{to{stroke-dashoffset:-28}}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.seg-g.sel .ln-road,.seg-g.sel .ln-sea,.seg-g.sel .ln-impl{stroke-width:4}
.seg-g.dim{opacity:.25}
.node-lbl{font:700 12px var(--f-body);fill:#fff;paint-order:stroke;stroke:#0C233C;stroke-width:3px;stroke-linejoin:round}
.node-sub{font:400 10.5px var(--f-body);fill:#BFD3EA;paint-order:stroke;stroke:#0C233C;stroke-width:3px;stroke-linejoin:round}
.badge-svg rect{fill:#fff}
.badge-svg text{font:700 10.5px var(--f-body);fill:#0C233C}
.tip{position:fixed;z-index:50;pointer-events:none;background:#333;color:#fff;border-radius:4px;padding:8px 12px;font-size:12px;line-height:1.45;max-width:320px;box-shadow:var(--shadow-3);display:none}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip span{color:#cfd6e0}
.ficha h3{font-size:16px;color:var(--primary);margin:0 0 2px}
.ficha .code{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:4px;color:#fff;font-weight:700;font-size:12px;margin-right:6px}
.ficha dl{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;margin:12px 0 0;font-size:13px}
.ficha dt{color:var(--muted);font-weight:700;font-size:12px}
.ficha dd{margin:0}
.ficha .src{font-size:11px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ficha .cost{background:var(--soft);border-radius:4px;padding:6px 8px;font-size:12px}
.ficha ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.ficha li{margin:3px 0}
.link{background:none;border:0;padding:0;color:var(--cobalt);font-weight:700;cursor:pointer;text-align:left;font-size:13px}
.link:hover{text-decoration:underline}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip.rfi{background:#F3ECFD;border-color:#F3ECFD;color:var(--purple)}
@media (max-width:860px){.stepbar{height:auto;flex-wrap:wrap;padding:8px 12px}.stepbar .steps{flex-basis:100%;overflow-x:auto}.stepbar .nav{margin-left:auto}}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.layout>div:nth-child(2){order:-1}.map-legend{position:static;margin:8px;max-width:none}.ficha-float{position:static;width:auto;max-height:none;box-shadow:none;margin-top:12px}}
</style>
<!-- ===== STYLE END ===== -->
</head>

<script id="app">
(function(){
const F = FLOW_DATA.facts, FL = FLOW_DATA.flows;
const ST = { lang:"pt", step:"all", dir:"both", on:{E1:true,E2:true,E3:true,S1:true,S2:true,S3:true}, mode:{E3:FL.E3.def, S2:FL.S2.def}, sel:null };
const STEPS = ["1","2","3","4","all"];
const STEP_FLOWS = { "1":["E2"], "2":["E1","E3"], "3":["S1"], "4":["S2","S3"], "all":["E1","E3","S1","S2","S3"] };
const ORDER = ["E1","E2","E3","S1","S2","S3"];
const COL = { in:"#00B8F5", out:"#00C0AE", impl:"#76D2FF", faded:"#9DB7D6" };
const svg = document.getElementById("map"), NS="http://www.w3.org/2000/svg";
const pt = k => GEO.pts[k];
// CD em posição esquemática dentro da RM de Fortaleza (Pecém, CD e capital ficam a poucos px no mapa nacional)
const CDP = [pt("cd_ce")[0]+26, pt("cd_ce")[1]+24];

function t(k,v){ let s=(I18N[ST.lang]&&I18N[ST.lang][k])??I18N.pt[k]??k; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; }
const nf = (n,d=0)=> new Intl.NumberFormat(ST.lang==="en"?"en-US":"pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
function E(tag,a){ const e=document.createElementNS(NS,tag); if(a) for(const k in a) e.setAttribute(k,a[k]); return e; }
function H(tag,a,html){ const e=document.createElement(tag); if(a) for(const k in a){ if(k.startsWith("on")) e.addEventListener(k.slice(2),a[k]); else e.setAttribute(k,a[k]); } if(html!=null) e.innerHTML=html; return e; }

/* ---------- geometria ---------- */
function curve(a,b,bend){ const [x1,y1]=a,[x2,y2]=b, dx=x2-x1, dy=y2-y1; return `M${x1},${y1} Q${((x1+x2)/2-dy*bend).toFixed(1)},${((y1+y2)/2+dx*bend).toFixed(1)} ${x2},${y2}`; }
function smooth(P){ let d=`M${P[0][0]},${P[0][1]}`; for(let i=0;i<P.length-1;i++){ const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`; } return d; }
const W = k => typeof k==="string" ? pt(k) : k;
const off = (P,dx,dy) => P.map((p,i)=> (i===0||i===P.length-1)? p : [p[0]+dx,p[1]+dy]);
const CAB_UP = ["port_santos","w_s1","w_s2","w_s3","w_s4","w_s5","w_s6","w_s7","w_s8","port_pecem"].map(W);
const SEA = {
  de:["sea_de","w_s8","port_pecem"].map(W), mx:["sea_mx","w_n1","w_n2","port_pecem"].map(W), cn:["sea_cn","w_e1","w_e2","w_s7","w_s8","port_pecem"].map(W),
  sa:["port_pecem","w_s8","w_s7","w_e2","w_e1","w_s2","w_s0","sea_sa"].map(W)
};
const CAPS = { salvador:"BA", recife:"PE", fortaleza:"CE", joaopessoa:"PB", natal:"RN", maceio:"AL", saoluis:"MA", teresina:"PI", aracaju:"SE" };

/* Segmentos por fluxo: {flow, kind: road|sea|impl|faded, col, icon, d, region?} */
function segments(id){
  const S=[], add=(o)=>S.push(Object.assign({flow:id},o));
  const m = ST.mode[id];
  if(id==="E1"){ ["de","mx","cn"].forEach(o=>add({kind:"sea",col:COL.in,icon:"ship",d:smooth(SEA[o]),dur:9000})); add({kind:"road",col:COL.in,icon:"truck",d:curve(pt("port_pecem"),CDP,0.25),dur:2500}); }
  if(id==="E2"){ add({kind:"impl",col:COL.impl,icon:"truck",d:curve(pt("cd_vin"),pt("port_santos"),0.3),dur:2500}); add({kind:"impl",col:COL.impl,icon:"ship",d:smooth(CAB_UP),dur:10000}); add({kind:"impl",col:COL.impl,icon:"truck",d:curve(pt("port_pecem"),CDP,0.25),dur:2500}); }
  if(id==="E3"){
    ["sup_se","sup_s","sup_co","sup_ne","sup_n"].forEach(s=>add({kind:"faded",col:COL.faded,d:curve(pt(s),pt("cd_vin"),0.12)}));
    if(m==="cab"){ add({kind:"road",col:COL.in,icon:"truck",d:curve(pt("cd_vin"),pt("port_santos"),0.3),dur:2500}); add({kind:"sea",col:COL.in,icon:"ship",d:smooth(off(CAB_UP,-7,-3)),dur:10000}); add({kind:"road",col:COL.in,icon:"truck",d:curve(pt("port_pecem"),CDP,0.25),dur:2500}); }
    else add({kind:"road",col:COL.in,icon:"truckL",d:curve(pt("cd_vin"),CDP,0.10),dur:7000});
  }
  if(id==="S1"){ for(const c in CAPS){ if(c==="fortaleza") continue; add({kind:"road",col:COL.out,icon:"truckS",d:curve(CDP,pt(c),0.15),dur:3200+Math.random()*1200,region:"NE"}); } }
  if(id==="S2"){
    if(m==="cab"){ add({kind:"road",col:COL.out,icon:"truck",d:curve(CDP,pt("port_pecem"),0.25),dur:2500}); add({kind:"sea",col:COL.out,icon:"ship",d:smooth(off(CAB_UP,7,4).slice().reverse()),dur:10000}); add({kind:"road",col:COL.out,icon:"truck",d:curve(pt("port_santos"),pt("cd_vin"),0.3),dur:2500,region:"SE"}); }
    else add({kind:"road",col:COL.out,icon:"truckL",d:curve(CDP,pt("cd_vin"),0.10),dur:7000,region:"SE"});
  }
  if(id==="S3"){ add({kind:"road",col:COL.out,icon:"truck",d:curve(CDP,pt("port_pecem"),-0.25),dur:2500}); add({kind:"sea",col:COL.out,icon:"ship",d:smooth(SEA.sa),dur:11000}); }
  return S;
}
function visible(){
  return STEP_FLOWS[ST.step].filter(id=> ST.on[id] && (ST.dir==="both" || FL[id].dir===ST.dir));
}

/* ---------- símbolos (mesmos do painel v1.1) ---------- */
function defs(){
  const d=E("defs");
  d.innerHTML=`<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <symbol id="i-truck" viewBox="0 0 32 18"><rect x="1" y="2" width="19" height="11" rx="1.5"/><path d="M21 6h5.5l4 4.5V13H21z"/><circle cx="7" cy="14.5" r="2.6" fill="#0C233C" stroke="currentColor" stroke-width="1.4"/><circle cx="25" cy="14.5" r="2.6" fill="#0C233C" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-ship" viewBox="0 0 32 20"><path d="M2 11h28l-4 7H6z"/><rect x="9" y="4" width="10" height="6" rx="1"/><rect x="20" y="6" width="5" height="4" rx=".8"/><rect x="12" y="1" width="3" height="3"/></symbol>
  <symbol id="i-factory" viewBox="0 0 32 28"><path d="M2 26V13l8 5v-5l8 5v-5l8 5V3h4v23z"/><rect x="6" y="20" width="3" height="3" fill="#0C233C"/><rect x="13" y="20" width="3" height="3" fill="#0C233C"/><rect x="20" y="20" width="3" height="3" fill="#0C233C"/></symbol>
  <symbol id="i-cd" viewBox="0 0 32 28"><path d="M2 11 16 2l14 9v15H2z"/><rect x="7" y="14" width="18" height="12" fill="#0C233C"/><path d="M8 17h16M8 20h16M8 23h16" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-tire" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#1d1d1d" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4M4.6 4.6l2.8 2.8M16.6 16.6l2.8 2.8M4.6 19.4l2.8-2.8M16.6 7.4l2.8-2.8" stroke="#555" stroke-width="1.6"/></symbol>
  <symbol id="i-anchor" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v14M7 11h10M3.5 14c0 4 4 7 8.5 7s8.5-3 8.5-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>`;
  svg.appendChild(d);
}
const ICON = { truck:[24,14], truckL:[30,17], truckS:[17,10], ship:[24,15] };

/* ---------- desenho ---------- */
let anim=[], raf=null, lit=0;
function render(){
  svg.innerHTML=""; defs(); anim=[];
  svg.appendChild(E("path",{d:GEO.bg,fill:"#10304F"}));
  const gS=E("g"); for(const k in GEO.states){ const s=GEO.states[k]; gS.appendChild(E("path",{d:s.d,class:"state"+(s.reg==="NE"?" ne":"")})); } svg.appendChild(gS);
  for(const r in GEO.regions){ svg.appendChild(E("path",{d:GEO.regions[r],class:"region",id:"reg-"+r})); }
  const vis = visible();
  document.getElementById("map-empty").hidden = vis.length>0;
  document.getElementById("map-empty").textContent = t("ui.empty");
  const gL=E("g"), gH=E("g"), gI=E("g");
  vis.forEach(id=>{
    const g=E("g",{class:"seg-g"+(ST.sel && ST.sel!==id?" dim":"")+(ST.sel===id?" sel":""),"data-flow":id});
    segments(id).forEach(s=>{
      const cls = s.kind==="road"?"ln-road":s.kind==="sea"?"ln-sea":s.kind==="impl"?"ln-impl":"ln-faded";
      const p=E("path",{d:s.d,class:cls,stroke:s.col}); g.appendChild(p);
      const h=E("path",{d:s.d,class:"hit","data-flow":id,tabindex:"-1"}); gH.appendChild(h);
      if(s.icon && s.kind!=="faded"){ const [w,hh]=ICON[s.icon]; const ic=E("g"); const sym=s.icon.startsWith("truck")?"truck":"ship";
        ic.appendChild(E("use",{href:"#i-"+sym,width:w,height:hh,x:-w/2,y:-hh/2,fill:s.col,color:s.col})); gI.appendChild(ic);
        anim.push({p,ic,dur:s.dur||5000,phase:Math.random()*5000,region:s.region,col:s.col}); }
    });
    gL.appendChild(g);
  });
  svg.appendChild(gL);
  nodes(vis);
  badges(vis);
  svg.appendChild(gI); svg.appendChild(gH);
  anim.forEach(a=>a.len=a.p.getTotalLength());
  gH.querySelectorAll(".hit").forEach(h=>{
    h.addEventListener("mousemove",e=>tip(e,h.dataset.flow)); h.addEventListener("mouseleave",()=>tipHide());
    h.addEventListener("click",()=>select(h.dataset.flow));
  });
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) staticPose();
}
function lbl(x,y,a,b,anchor="start"){ const t1=E("text",{x,y,class:"node-lbl","text-anchor":anchor}); t1.textContent=a; svg.appendChild(t1); if(b){ const t2=E("text",{x,y:y+12,class:"node-sub","text-anchor":anchor}); t2.textContent=b; svg.appendChild(t2);} }
function node(sym,x,y,size,col,ring){ const g=E("g"); g.appendChild(E("circle",{cx:x,cy:y,r:size*0.75,fill:"#0C233C",stroke:ring||col,"stroke-width":1.6})); g.appendChild(E("use",{href:"#i-"+sym,x:x-size/2,y:y-size/2,width:size,height:size,fill:col,color:col})); svg.appendChild(g); return g; }
function nodes(vis){
  const has = id=>vis.includes(id);
  // capitais do NE (pontos) — % de CT-es por UF no passo 3
  for(const c in CAPS){ const [x,y]=pt(c); svg.appendChild(E("circle",{cx:x,cy:y,r:3.2,fill:has("S1")?"#00C0AE":"#7FA6CF",stroke:"#0C233C","stroke-width":1}));
    if(c!=="fortaleza"){ const uf=CAPS[c]; const lab = has("S1") ? `${uf} ${F.uf_mix[uf]}%` : uf; const tx=E("text",{x:x+(c==="saoluis"||c==="teresina"?-6:6),y:y+(c==="joaopessoa"?2:c==="recife"?6:4),class:"node-sub","text-anchor":(c==="saoluis"||c==="teresina")?"end":"start"}); tx.textContent=lab; svg.appendChild(tx);} }
  // fornecedores nacionais (esmaecidos, só com E3)
  if(has("E3")){ ["sup_se","sup_s","sup_co","sup_ne","sup_n"].forEach(k=>{ const [x,y]=pt(k); const g=node("factory",x,y,13,"#9DB7D6"); g.setAttribute("opacity",".6"); }); const [x,y]=pt("sup_s"); lbl(x+12,y+4,t("n.sup")); }
  // portos
  { const [x,y]=pt("port_santos"); node("anchor",x,y,12,"#76D2FF"); lbl(x+12,y+16,t("n.santos")); }
  { const [x,y]=pt("port_pecem"); node("anchor",x,y,12,"#76D2FF"); lbl(x-4,y-14,t("n.pecem"),null,"end"); }
  // origens internacionais
  if(has("E1")){
    { const [x,y]=pt("sea_de"); node("ship",x,y,20,"#76D2FF"); lbl(x-18,y-2,t("n.de"),`${t("n.de2")} · ${F.imp_mix.DE}%`,"end"); }
    { const [x,y]=pt("sea_mx"); node("ship",x,y,20,"#76D2FF"); lbl(x+18,y+4,t("n.mx"),`${F.imp_mix.MX}%`); }
    { const [x,y]=pt("sea_cn"); node("ship",x,y,20,"#76D2FF"); svg.appendChild(E("use",{href:"#i-tire",x:x+12,y:y-26,width:18,height:18,color:"#76D2FF"})); lbl(x-18,y-2,t("n.cn"),`${t("n.cn2")} · ${F.imp_mix.CN}%`,"end"); }
  }
  if(has("S3")){ const [x,y]=pt("sea_sa"); node("ship",x,y,20,"#00C0AE"); lbl(x+18,y-4,t("n.sa"),t("n.sa2")); }
  // CD Vinhedo
  { const [x,y]=pt("cd_vin"); node("cd",x,y,22,"#FFFFFF"); lbl(x-20,y-4,t("n.vin"),t("n.vin2"),"end"); }
  // CD Nordeste: área da RM + ícone esquemático
  { const [rx,ry]=pt("cd_ce"); svg.appendChild(E("circle",{cx:rx,cy:ry,r:9,fill:"rgba(255,255,255,.12)",stroke:"#fff","stroke-dasharray":"2 2","stroke-width":1}));
    svg.appendChild(E("line",{x1:rx+5,y1:ry+5,x2:CDP[0]-8,y2:CDP[1]-8,stroke:"#fff","stroke-width":1,"stroke-dasharray":"2 2",opacity:.7}));
    const g=node("cd",CDP[0],CDP[1],28,"#FFFFFF","#00B8F5"); g.querySelector("circle").setAttribute("stroke-width","2.5");
    lbl(CDP[0]+24,CDP[1]-14,t("n.cd"),t("n.cd2")); }
}
function badge(x,y,text,col){ const g=E("g",{class:"badge-svg"}); const w=text.length*5.9+16; g.appendChild(E("rect",{x:x-w/2,y:y-10,width:w,height:20,rx:4,stroke:col||"#00338D","stroke-width":1.5})); const tx=E("text",{x,y:y+4,"text-anchor":"middle"}); tx.textContent=text; g.appendChild(tx); svg.appendChild(g); }
function badges(vis){
  const has=id=>vis.includes(id);
  if(has("E2")){ const p=pt("w_s4"); badge(p[0]+40,p[1],t("b.impl"),"#76D2FF"); }
  if(has("E1")){ const p=pt("port_pecem"); badge(p[0]+90,p[1]-50,t("b.split"),"#00B8F5"); }
  if(has("E3")&&has("S2")){
    if(ST.mode.E3==="ftlR"&&ST.mode.S2==="ftlR"){ const a=pt("cd_vin"); badge((a[0]+CDP[0])/2-10,(a[1]+CDP[1])/2+20,"⇄ "+t("b.loopFTL"),"#00338D"); }
    if(ST.mode.E3==="cab"&&ST.mode.S2==="cab"){ const p=pt("w_s3"); badge(p[0]+95,p[1]+10,"⇄ "+t("b.loopCab"),"#00338D"); }
  }
}

/* ---------- animação ---------- */
function tick(now){
  raf=requestAnimationFrame(tick);
  let glowNE=0, glowSE=0;
  anim.forEach(a=>{ if(!a.len) return; const k=((now+a.phase)%a.dur)/a.dur; const p=a.p.getPointAtLength(k*a.len), q=a.p.getPointAtLength(Math.min(a.len,k*a.len+2));
    a.ic.setAttribute("transform",`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${q.x<p.x?-1:1},1)`);
    a.ic.setAttribute("opacity", k<0.04?k/0.04 : k>0.96?(1-k)/0.04 : 1);
    if(a.region==="NE" && k>0.85) glowNE=1; if(a.region==="SE" && k>0.85) glowSE=1; });
  lit = Math.max(glowNE?1:0, lit*0.97);
  const ne=document.getElementById("reg-NE"), se=document.getElementById("reg-SE");
  if(ne){ const on=visible().includes("S1"); ne.style.stroke=on?"#00C0AE":""; ne.style.strokeOpacity=on?(0.55+0.45*lit).toFixed(2):""; ne.style.strokeWidth=on?"2.5":""; if(on) ne.setAttribute("filter","url(#glow)"); else ne.removeAttribute("filter"); }
  if(se){ se.style.stroke=glowSE?"#00C0AE":""; se.style.strokeOpacity=glowSE?".9":""; se.style.strokeWidth=glowSE?"2.5":""; }
}
function staticPose(){ anim.forEach(a=>{ const p=a.p.getPointAtLength((a.len||0)*0.55); a.ic.setAttribute("transform",`translate(${p.x},${p.y})`); }); }

/* ---------- textos de ficha ---------- */
function vars(id){
  const m=ST.mode[id];
  return {
    fob:nf(F.imp_fob_mi,1), de:F.imp_mix.DE, mx:F.imp_mix.MX, cn:F.imp_mix.CN, r:F.imp_ret_pct, n:100-F.imp_ret_pct,
    t: id==="E2"? nf(F.carga_inicial_t) : id==="S1"? nf(F.peso_t) : nf(F.trucks_dn),
    d: (m==="cab"||id==="E2") ? F.lead_cab_d : (id==="S1"? F.deliv_urg : F.lead_ftl_d),
    v: id==="S2"? nf(F.vol_imp_m3) : nf(id==="S1"?F.vol_s1_m3:F.vol_nac_m3),
    c: id==="S1"? nf(F.ctes) : id==="E3"? nf(m==="cab"?F.cont_up:F.carretas_up) : nf(m==="cab"?F.cont_dn:F.carretas_dn),
    cm: nf(F.ctes_m), m:F.munis, cap:F.cap_share, u:F.urg_share, r2:F.exp_rep, g:F.exp_urg, l:nf(F.rcc_lines),
    mix: Object.entries(F.uf_mix).map(([k,v])=>`${k} ${v}%`).join(" · "),
    via: m? t(id+".via."+m) : ""
  };
}
function txt(id,field){ const m=ST.mode[id]; const k1=`${id}.${field}.${m}`; const key = (m && I18N.pt[k1]) ? k1 : `${id}.${field}`;
  const v=vars(id); if(id==="S1"&&field==="lead") return t(key,{r:F.exp_rep,g:F.exp_urg,d:F.deliv_urg}); return t(key,v); }
function statusOf(id){ const f=FL[id]; return f.modes? f.modes[ST.mode[id]].status : f.status; }
function costOf(id){ const f=FL[id]; return f.modes? f.modes[ST.mode[id]].cost : f.cost; }
function chips(id){ const cls={vw:"conf",kpmg:"kpmg",rfi:"rfi",dim:"pend"}; return `<span class="chips">${statusOf(id).map(s=>`<span class="chip ${cls[s]}">${t("st."+s)}</span>`).join("")}</span>`; }

function tip(e,id){ const el=document.getElementById("tip");
  el.innerHTML=`<b>${id} · ${t("f."+id)}</b>${txt(id,"modal")}<br><span>${t("k.route")}:</span> ${txt(id,"route")}<br><span>${t("k.vol")}:</span> ${txt(id,"vol")}<br><span>${t("k.freq")}:</span> ${txt(id,"freq")}<br><span>${t("k.lead")}:</span> ${txt(id,"lead")}<br><span>${t("k.status")}:</span> ${statusOf(id).map(s=>t("st."+s)).join(" · ")}`;
  el.style.display="block"; const x=Math.min(e.clientX+14, innerWidth-340), y=Math.min(e.clientY+14, innerHeight-el.offsetHeight-10); el.style.left=x+"px"; el.style.top=y+"px"; }
function tipHide(){ document.getElementById("tip").style.display="none"; }

function ficha(){
  const box=document.getElementById("ficha"), id=ST.sel;
  if(!id){
    const ids=STEP_FLOWS[ST.step];
    box.innerHTML=`<h3>${ST.step==="all"?t("ui.all"):ST.step+" · "+t("step."+ST.step)}</h3><p class="note" style="margin:4px 0 0">${t("ficha.hint")}</p>
      <p class="note" style="margin:12px 0 0"><b>${t("ficha.inStep")}</b></p><ul>${ids.map(i=>`<li><button class="link" data-f="${i}">${i} · ${t("f."+i)}</button></li>`).join("")}</ul>`;
    box.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.f)));
    return;
  }
  const c=costOf(id);
  box.innerHTML=`<h3><span class="code" style="background:${FL[id].color==="out"?"#098E7E":FL[id].color==="impl"?"#1E49E2":"#00338D"}">${id}</span>${t("f."+id)}</h3>
    <dl>
      <dt>${t("k.modal")}</dt><dd>${txt(id,"modal")}</dd>
      <dt>${t("k.route")}</dt><dd>${txt(id,"route")}</dd>
      <dt>${t("k.vol")}</dt><dd class="num">${txt(id,"vol")}</dd>
      <dt>${t("k.freq")}</dt><dd class="num">${txt(id,"freq")}</dd>
      <dt>${t("k.lead")}</dt><dd>${txt(id,"lead")}</dd>
      <dt>${t("k.status")}</dt><dd>${chips(id)}</dd>
      <dt>${t("k.cost")}</dt><dd><div class="cost">${c==null?t("cost.pending"):nf(c,2)+(ST.lang==="en"?" BRL M/yr":" R$ mi/ano")}</div></dd>
      <dt>${t("k.note")}</dt><dd>${txt(id,"note")}${(id==="E3"||id==="S2")?rtNote():""}</dd>
    </dl>
    <div class="src">${t("src."+id)}</div>
    <p style="margin:10px 0 0"><button class="link" id="desel">✕ ${ST.lang==="en"?"Close fact sheet":"Fechar ficha"}</button></p>`;
  document.getElementById("desel").addEventListener("click",()=>select(null));
}
function rtNote(){ const a=ST.mode.E3, b=ST.mode.S2; if((a==="ftlR")!==(b==="ftlR")) return `<br><span class="note">${t("rt.ftlAlone").trim()}</span>`; return ""; }

/* ---------- viagem redonda (caixa lateral) ---------- */
function roundTrip(){
  const box=document.getElementById("rt"); const vis=visible();
  if(!(ST.on.E3&&ST.on.S2) || !(STEP_FLOWS[ST.step].includes("E3")||STEP_FLOWS[ST.step].includes("S2"))){ box.innerHTML=""; return; }
  const a=ST.mode.E3, b=ST.mode.S2; let html, warn=false;
  if(a==="ftlR"&&b==="ftlR") html=t("rt.ftl",{up:nf(F.vol_nac_m3),dn:nf(F.vol_imp_m3),p:F.imbalance_pct,x:nf(F.carretas_up-F.carretas_dn),cu:nf(F.carretas_up),cd:nf(F.carretas_dn)});
  else if(a==="cab"&&b==="cab") html=t("rt.cab",{cu:nf(F.cont_up),cd:nf(F.cont_dn),p:F.imbalance_pct,x:nf(F.cont_up-F.cont_dn)});
  else { html=t("rt.mixed",{a:t("m."+a),b:t("m."+b)}); if(a==="ftlR"||b==="ftlR"){ html+=t("rt.ftlAlone"); warn=true; } }
  box.innerHTML=`<div class="rt-box${warn?" warn":""}"><p class="ctl" style="margin:0 0 4px"><b style="text-transform:uppercase;font-size:12px">${t("rt.title")}</b></p>${html}</div>`;
}

/* ---------- controles ---------- */
function controls(){
  const dir=document.getElementById("dir"); dir.innerHTML="";
  [["in","ui.in"],["out","ui.out"],["both","ui.both"]].forEach(([k,l])=>dir.appendChild(H("button",{type:"button","aria-pressed":ST.dir===k,onclick:()=>{ST.dir=k;update();}},t(l))));
  const L=document.getElementById("flow-list"); L.innerHTML="";
  ORDER.forEach(id=>{
    const inStep=STEP_FLOWS[ST.step].includes(id), f=FL[id];
    const col = f.color==="out"?COL.out : f.color==="impl"?COL.impl : COL.in;
    const isSea = id==="E1"||id==="E2"||id==="S3"||ST.mode[id]==="cab";
    const row=H("div",{class:"frow"+(inStep&&(ST.dir==="both"||f.dir===ST.dir)?"":" off")});
    const cb=H("input",{type:"checkbox",id:"cb-"+id}); cb.checked=ST.on[id]; cb.addEventListener("change",()=>{ST.on[id]=cb.checked; if(!cb.checked&&ST.sel===id) ST.sel=null; update();});
    row.appendChild(cb);
    row.appendChild(H("span",{class:"sw"+(isSea?" sea":""),style:`background:${col};color:${col}`}));
    const sub = id==="E2" ? `${t("f.E2.s")} · <i>${t("ui.onlyStep1")}</i>` : (!inStep? `${t("f."+id+".s")} · <i>${t("ui.notInStep")}</i>` : t("f."+id+".s"));
    const lb=H("label",{for:"cb-"+id},`${id} · ${t("f."+id)}<small>${sub}</small>`);
    lb.addEventListener("dblclick",e=>{e.preventDefault();select(id);});
    row.appendChild(lb);
    if(f.modes){ const md=H("div",{class:"modes"}); const sg=H("div",{class:"seg"});
      Object.keys(f.modes).forEach(k=>sg.appendChild(H("button",{type:"button","aria-pressed":ST.mode[id]===k,onclick:()=>{ST.mode[id]=k;update();}},t("m."+k)))); md.appendChild(sg); row.appendChild(md); }
    if(inStep) row.appendChild(H("div",{class:"modes"},`<button class="link" type="button" style="font-size:11px">${ST.lang==="en"?"Open fact sheet":"Ver ficha"} →</button>`)).querySelector("button").addEventListener("click",()=>select(id));
    L.appendChild(row);
  });
  // passo a passo
  const S=document.getElementById("steps"); S.innerHTML="";
  STEPS.forEach(s=>S.appendChild(H("button",{type:"button",class:"st","aria-current":ST.step===s?"step":"false",onclick:()=>go(s)},s==="all"?`<span class="n">★</span>${t("ui.all")}`:`<span class="n">${s}</span>${t("step."+s)}`)));
  const i=STEPS.indexOf(ST.step);
  const pv=document.getElementById("prev"), nx=document.getElementById("next");
  pv.textContent=t("ui.prev"); nx.textContent=t("ui.next");
  pv.disabled = i===0; nx.disabled = i===STEPS.length-1;
  document.getElementById("cap-title").textContent = ST.step==="all"? t("ui.all") : `${ST.step} · ${t("step."+ST.step)}`;
  document.getElementById("cap-text").textContent = t("cap."+ST.step);
  // legenda
  const row=(c,dash,k,w=2.2,op=1)=>`<div><svg viewBox="0 0 34 10"><line x1="2" y1="5" x2="32" y2="5" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:""} opacity="${op}"/></svg>${t(k)}</div>`;
  document.getElementById("legend").innerHTML = row(COL.in,"","leg.in",4)+row(COL.out,"","leg.out",4)+row("#fff","","leg.road")+row("#fff","8 6","leg.sea")+row(COL.impl,"2 5","leg.impl")+row(COL.faded,"","leg.milk",1.4,.6)+`<div class="ln">${t("leg.note")}</div>`;
}
function go(s){ ST.step=s; if(ST.sel && !STEP_FLOWS[s].includes(ST.sel)) ST.sel=null; try{ history.replaceState(null,"","#passo-"+s); }catch(e){} update(); }
function select(id){ ST.sel=id; ficha(); render(); }
function applyI18n(){
  document.documentElement.lang = ST.lang==="en"?"en":"pt-BR";
  document.querySelectorAll("[data-i18n]").forEach(e=>e.innerHTML=t(e.dataset.i18n));
  document.title = ST.lang==="en"?"Northeast DC flows":"Fluxos do CD Nordeste";
  document.getElementById("lang-pt").setAttribute("aria-pressed",ST.lang==="pt"); document.getElementById("lang-en").setAttribute("aria-pressed",ST.lang==="en");
  document.getElementById("foot1").textContent=t("foot1");
  document.getElementById("foot2").textContent=t("foot2",{v:FLOW_DATA.meta.page.replace("v",""),r:FLOW_DATA.meta.rfi,m:FLOW_DATA.meta.md});
}
function update(){ applyI18n(); controls(); roundTrip(); ficha(); render(); }

document.getElementById("prev").addEventListener("click",()=>{ const i=STEPS.indexOf(ST.step); if(i>0) go(STEPS[i-1]); });
document.getElementById("next").addEventListener("click",()=>{ const i=STEPS.indexOf(ST.step); if(i<STEPS.length-1) go(STEPS[i+1]); });
document.getElementById("lang-pt").addEventListener("click",()=>{ST.lang="pt";try{localStorage.setItem("vwcdne-lang","pt")}catch(e){}update();});
document.getElementById("lang-en").addEventListener("click",()=>{ST.lang="en";try{localStorage.setItem("vwcdne-lang","en")}catch(e){}update();});
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") document.getElementById("next").click(); if(e.key==="ArrowLeft") document.getElementById("prev").click(); if(e.key==="Escape") select(null); });
try{ const l=localStorage.getItem("vwcdne-lang"); if(l==="en"||l==="pt") ST.lang=l; }catch(e){}
const h=(location.hash||"").replace("#passo-",""); if(STEPS.includes(h)) ST.step=h;
update();
raf=requestAnimationFrame(tick);
window.__FLX = { ST, visible, segments, go, select };   // apoio a testes
})();
</script>
